name: Experimental stream parity probe at scale
# Measurement only. The Hub token exists in the last step only and is used to READ one private test file; nothing is written to the Hub.
'on':
  push:
    branches: [claude/parity-probe-32b]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      LLAMA_COMMIT: 19ff817fb25e9a1b838b1d7f9f4325f7bf9779c4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ggml-org/llama.cpp
          ref: 19ff817fb25e9a1b838b1d7f9f4325f7bf9779c4
          path: llama-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          df -h / | cat
      - name: Build the unchanged pinned stock quantizer (CPU)
        run: |
          set -euo pipefail
          test "$(git -C llama-source rev-parse HEAD)" = "$LLAMA_COMMIT"
          cmake -S llama-source -B "$RUNNER_TEMP/llama-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_COMMIT="$LLAMA_COMMIT"
          cmake --build "$RUNNER_TEMP/llama-build" -j 2 --target llama-quantize
      - name: The matrix of the streamed run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hfqa-matrix-41227992856
          run-id: 41227992856
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/matrix
      - name: Dependencies
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/pip" install numpy==2.2.6 huggingface_hub==2.3.0 hf-xet==1.7.0 gguf
      - name: Stock quantizer with the same matrix, compared tensor by tensor with the streamed file
        working-directory: hf-quant-agent
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/llama-build/bin"
          "$RUNNER_TEMP/env/bin/python" scripts/probe_stream_parity_remote.py --tool-dir "$RUNNER_TEMP/llama-build/bin" --request github/requests/parity32-probe.json --matrix "$RUNNER_TEMP/matrix/importance.dat" --work "$RUNNER_TEMP/parity32" --report "$RUNNER_TEMP/parity32.json"
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parity32-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/parity32.json
          if-no-files-found: warn
          retention-days: 14
