name: Finalize completed Sage uploads
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Sage BF16 CPU quantization and release]
    types: [completed]
    branches: [main]
  push:
    paths: [recovery-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: sage-upload-finalization
  cancel-in-progress: false
jobs:
  finalize:
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.id == 39845179392 &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPO_VISIBILITY: public
      SAGE_STANDARD_RUNNER: ubuntu-24.04
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify small recovery sources
        run: sha256sum -c SHA256SUMS
      - name: Install pinned publication client
        run: python -m pip install -r requirements-upload.txt
      - name: Validate completed job evidence and finalize existing uploads
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess,sys,os
          request=json.load(open('recovery-request.json'))
          if os.environ.get('GITHUB_EVENT_NAME')=='workflow_run':
              request={'run_id':39845179392,'variants':['Q4_K_M']}
          assert request['run_id']==39845179392
          assert request['variants'] and set(request['variants']) <= {'Q4_K_M','Q5_K_M'}
          for variant in request['variants']:
              subprocess.run([sys.executable,'recover_publish.py','--variant',variant],check=True)
          PY
      # No source weights, re-quantization, GPU, model artifacts or paid runner.
