name: HFQA native GGUF streaming
run-name: HFQA stream ${{ inputs.job_id || 'qualification' }}
'on':
  push:
    branches: [codex/hfqa-native-stream]
    paths: ['hf-quant-agent/**', '.github/workflows/hfqa-native-stream.yml']
  workflow_dispatch:
    inputs:
      job_id:
        description: Controller job identifier
        required: false
        default: qualification
      mode:
        type: choice
        options: [proof, stage, release, qualify, hybrid, convert, imatrix]
        default: proof
      manifest_json:
        description: Immutable source manifest JSON; empty uses the fixed small qualification fixture
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: hfqa-native-stream-${{ inputs.job_id || github.ref }}
  cancel-in-progress: false
jobs:
  stream:
    if: github.event.repository.private == false && inputs.mode != 'release' && inputs.mode != 'hybrid' && inputs.mode != 'convert' && inputs.mode != 'imatrix'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HFQA_STREAM_MODE: ${{ inputs.mode || 'proof' }}
      HFQA_MANIFEST_JSON: ${{ inputs.manifest_json }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned native runtime and isolated dependencies
        working-directory: hf-quant-agent
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hfqa-env"
          "$RUNNER_TEMP/hfqa-env/bin/pip" install numpy==2.2.6 huggingface_hub==2.3.0 hf-xet==1.7.0
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          raw=os.environ.get('HFQA_MANIFEST_JSON','')
          if len(raw)>100000: raise ValueError('dispatch manifest exceeds input budget')
          data=json.loads(raw) if raw.strip() else json.loads(pathlib.Path('github/requests/stream-smoke.json').read_text(encoding='utf-8-sig'))
          (root/'hfqa-request.json').write_text(json.dumps(data),encoding='utf-8')
          PY
          python scripts/fetch_stream_runtime.py --destination "$RUNNER_TEMP/hfqa-runtime" --manifest "$RUNNER_TEMP/hfqa-request.json" > "$RUNNER_TEMP/hfqa-runtime-path"
          runtime_dir=$(cat "$RUNNER_TEMP/hfqa-runtime-path")
          python scripts/build_stream_bridge.py --runtime "$runtime_dir" --destination "$RUNNER_TEMP/hfqa-bridge" --manifest "$RUNNER_TEMP/hfqa-request.json"
      - name: Validate metadata and tests without repository code execution
        working-directory: hf-quant-agent
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hfqa-env/bin/python" -m unittest discover -s tests -q
      - name: Stream bounded native rows and verify source digests
        working-directory: hf-quant-agent
        run: |
          set -euo pipefail
          runtime_dir=$(cat "$RUNNER_TEMP/hfqa-runtime-path")
          export LD_LIBRARY_PATH="$runtime_dir"
          "$RUNNER_TEMP/hfqa-env/bin/python" scripts/stream_ci.py --manifest "$RUNNER_TEMP/hfqa-request.json" --runtime "$runtime_dir" --bridge "$RUNNER_TEMP/hfqa-bridge/libhfqa_plan.so" --work "$RUNNER_TEMP/hfqa-result" --mode "$HFQA_STREAM_MODE"
      - name: Retain receipts and actual runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hfqa-stream-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hfqa-result/**/*.json
            ${{ runner.temp }}/hfqa-result/**/*.log
            ${{ runner.temp }}/hfqa-bridge/build-receipt.json
          if-no-files-found: warn
          retention-days: 7
  plan:
    if: github.event.repository.private == false && inputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      quants: ${{ steps.matrix.outputs.quants }}
    steps:
      - id: matrix
        env:
          HFQA_MANIFEST_JSON: ${{ inputs.manifest_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          raw = os.environ['HFQA_MANIFEST_JSON']
          if not raw.strip() or len(raw) > 100000:
              raise SystemExit('release mode needs an explicit manifest within the input budget')
          quants = json.loads(raw).get('quants')
          if not isinstance(quants, list) or not quants or len(quants) > 8 or any(not re.fullmatch(r'Q[0-9A-Z_]{1,12}', str(q)) for q in quants):
              raise SystemExit('manifest has no valid quant list')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('quants=' + json.dumps(quants) + '\n')
          PY
  release:
    needs: plan
    if: github.event.repository.private == false && inputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        quant: ${{ fromJson(needs.plan.outputs.quants) }}
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HFQA_MANIFEST_JSON: ${{ inputs.manifest_json }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Free disk space and record the machine (measured, not assumed)
        run: |
          set -euo pipefail
          echo "before:"; df -h / /mnt | cat; nproc; free -g | head -2
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          echo "after:"; df -h / /mnt | cat
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned native runtime and isolated dependencies
        working-directory: hf-quant-agent
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hfqa-env"
          "$RUNNER_TEMP/hfqa-env/bin/pip" install numpy==2.2.6 huggingface_hub==2.3.0 hf-xet==1.7.0
          python - <<'PY'
          import os, pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'], 'hfqa-request.json').write_text(os.environ['HFQA_MANIFEST_JSON'], encoding='utf-8')
          PY
          python scripts/fetch_stream_runtime.py --destination "$RUNNER_TEMP/hfqa-runtime" --manifest "$RUNNER_TEMP/hfqa-request.json" > "$RUNNER_TEMP/hfqa-runtime-path"
          runtime_dir=$(cat "$RUNNER_TEMP/hfqa-runtime-path")
          python scripts/build_stream_bridge.py --runtime "$runtime_dir" --destination "$RUNNER_TEMP/hfqa-bridge" --manifest "$RUNNER_TEMP/hfqa-request.json"
      - name: Quantize, verify, run a real inference, then stage on a branch (never main)
        working-directory: hf-quant-agent
        run: |
          set -euo pipefail
          runtime_dir=$(cat "$RUNNER_TEMP/hfqa-runtime-path")
          export LD_LIBRARY_PATH="$runtime_dir"
          "$RUNNER_TEMP/hfqa-env/bin/python" scripts/run_release_worker.py \
            --manifest "$RUNNER_TEMP/hfqa-request.json" --quant "${{ matrix.quant }}" \
            --bridge "$RUNNER_TEMP/hfqa-bridge/libhfqa_plan.so" --ggml "$runtime_dir/libggml-base.so" \
            --llama-cli "$runtime_dir/llama-cli" --work "$RUNNER_TEMP/hfqa-release" \
            --job-id "${{ inputs.job_id }}" --branch "hfqa-staging-${{ inputs.job_id }}" --upload
      - name: Retain the receipt and the real inference logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hfqa-release-receipt-${{ github.run_id }}-${{ matrix.quant }}
          path: |
            ${{ runner.temp }}/hfqa-release/receipts/*.json
            ${{ runner.temp }}/hfqa-release/*/logs/*.log
            ${{ runner.temp }}/hfqa-bridge/build-receipt.json
          if-no-files-found: warn
          retention-days: 30
  convert:
    if: github.event.repository.private == false && inputs.mode == 'convert'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      OMP_NUM_THREADS: '4'
      HFQA_MANIFEST_JSON: ${{ inputs.manifest_json }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read the manifest (revisions must be exact commits)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          raw = os.environ['HFQA_MANIFEST_JSON']
          if not raw.strip() or len(raw) > 100000:
              raise SystemExit('convert mode needs an explicit manifest within the input budget')
          revision = json.loads(raw).get('llama_revision', '')
          if not re.fullmatch(r'[a-f0-9]{40}', revision):
              raise SystemExit('manifest has no exact llama.cpp revision')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'hfqa-request.json').write_text(raw, encoding='utf-8')
          PY
      - name: Free disk space and record the machine (measured, not assumed)
        run: |
          set -euo pipefail
          echo "before:"; df -h / /mnt | cat; nproc; free -g | head -2
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          echo "after:"; df -h / /mnt | cat
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ fromJSON(inputs.manifest_json).llama_revision }}
          path: llama
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the official converter's requirements (CPU only)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/convert-env"
          "$RUNNER_TEMP/convert-env/bin/pip" install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/convert-env/bin/pip" install --quiet numpy sentencepiece transformers protobuf safetensors requests huggingface_hub hf-xet
          df -h / /mnt | cat
      - name: Convert to BF16 GGUF, upload shard by shard, verify on the Hub
        working-directory: hf-quant-agent
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hfqa-convert"
          "$RUNNER_TEMP/convert-env/bin/python" scripts/convert_stream.py --manifest "$RUNNER_TEMP/hfqa-request.json" --llama "$GITHUB_WORKSPACE/llama" --work "$RUNNER_TEMP/hfqa-convert"
          df -h / /mnt | cat
      - name: Retain the receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hfqa-convert-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/hfqa-convert/convert-receipt.json
          if-no-files-found: warn
          retention-days: 30
  imatrix:
    if: github.event.repository.private == false && inputs.mode == 'imatrix'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HFQA_MANIFEST_JSON: ${{ inputs.manifest_json }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Free disk space and record the machine (measured, not assumed)
        run: |
          set -euo pipefail
          echo "before:"; df -h / /mnt | cat; nproc; free -g | head -2
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          echo "after:"; df -h / /mnt | cat
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare the pinned stock runtime (llama-imatrix, llama-quantize, llama-cli) and isolated dependencies
        working-directory: hf-quant-agent
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hfqa-env"
          "$RUNNER_TEMP/hfqa-env/bin/pip" install numpy==2.2.6 huggingface_hub==2.3.0 hf-xet==1.7.0
          python - <<'PY'
          import os, pathlib
          raw = os.environ['HFQA_MANIFEST_JSON']
          if not raw.strip() or len(raw) > 100000:
              raise SystemExit('imatrix mode needs an explicit manifest within the input budget')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'hfqa-request.json').write_text(raw, encoding='utf-8')
          PY
          python scripts/fetch_stream_runtime.py --destination "$RUNNER_TEMP/hfqa-runtime" --manifest "$RUNNER_TEMP/hfqa-request.json" > "$RUNNER_TEMP/hfqa-runtime-path"
      - name: Importance matrix, quantize with it, verify, run a real inference, then stage on a branch (never main)
        working-directory: hf-quant-agent
        run: |
          set -euo pipefail
          runtime_dir=$(cat "$RUNNER_TEMP/hfqa-runtime-path")
          "$RUNNER_TEMP/hfqa-env/bin/python" scripts/run_imatrix_worker.py \
            --manifest "$RUNNER_TEMP/hfqa-request.json" --runtime-dir "$runtime_dir" --work "$RUNNER_TEMP/hfqa-imatrix" \
            --job-id "${{ inputs.job_id }}" --branch "hfqa-staging-${{ inputs.job_id }}" --upload
      - name: Retain the receipts and the tool logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hfqa-imatrix-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hfqa-imatrix/receipts/*.json
            ${{ runner.temp }}/hfqa-imatrix/logs/*.log
            ${{ runner.temp }}/hfqa-imatrix/*/logs/*.log
          if-no-files-found: warn
          retention-days: 30
  hybrid:
    if: github.event.repository.private == false && inputs.mode == 'hybrid'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HFQA_MANIFEST_JSON: ${{ inputs.manifest_json }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Free disk space and record the machine (measured, not assumed)
        run: |
          set -euo pipefail
          echo "before:"; df -h / /mnt | cat; nproc; free -g | head -2
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          echo "after:"; df -h / /mnt | cat
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare the pinned ggml runtime and isolated dependencies
        working-directory: hf-quant-agent
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hfqa-env"
          "$RUNNER_TEMP/hfqa-env/bin/pip" install numpy==2.2.6 huggingface_hub==2.3.0 hf-xet==1.7.0
          python - <<'PY'
          import os, pathlib
          raw = os.environ['HFQA_MANIFEST_JSON']
          if not raw.strip() or len(raw) > 100000:
              raise SystemExit('hybrid mode needs an explicit manifest within the input budget')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'hfqa-request.json').write_text(raw, encoding='utf-8')
          PY
          python scripts/fetch_stream_runtime.py --destination "$RUNNER_TEMP/hfqa-runtime" --manifest "$RUNNER_TEMP/hfqa-request.json" > "$RUNNER_TEMP/hfqa-runtime-path"
      - name: Build the table file, verify it, then stage it on a branch (never main)
        working-directory: hf-quant-agent
        run: |
          set -euo pipefail
          runtime_dir=$(cat "$RUNNER_TEMP/hfqa-runtime-path")
          "$RUNNER_TEMP/hfqa-env/bin/python" scripts/run_hybrid_worker.py             --manifest "$RUNNER_TEMP/hfqa-request.json" --ggml "$runtime_dir/libggml-base.so"             --work "$RUNNER_TEMP/hfqa-hybrid" --job-id "${{ inputs.job_id }}" --branch "hfqa-staging-${{ inputs.job_id }}" --upload
      - name: Retain the receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hfqa-hybrid-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hfqa-hybrid/receipts/*.json
          if-no-files-found: warn
          retention-days: 30
