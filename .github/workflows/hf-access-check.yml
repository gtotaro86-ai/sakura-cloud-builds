name: Check HF secret and account
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hf-access-check.yml
permissions:
  contents: read
jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify secret presence and HF identity without printing credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          token = os.environ.get('HF_TOKEN', '').strip()
          if not token:
              raise SystemExit('HF_TOKEN is missing from repository Actions secrets')
          print('HF_TOKEN configured: yes', flush=True)
          request = urllib.request.Request('https://huggingface.co/api/whoami-v2', headers={'Authorization': 'Bearer ' + token})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read(1_000_001)
              if len(raw) > 1_000_000:
                  raise SystemExit('Unexpected HF identity response size')
              data = json.loads(raw)
          except urllib.error.HTTPError as error:
              raise SystemExit('HF authentication failed: HTTP ' + str(error.code))
          if data.get('name') != 'webmp3':
              raise SystemExit('The token belongs to a different HF account than webmp3')
          role = data.get('auth', {}).get('accessToken', {}).get('role')
          if role == 'read':
              raise SystemExit('The HF token authenticates but is read-only; a write-capable token is required')
          print('HF authentication passed; authorized account: webmp3', flush=True)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('HF_TOKEN configured: yes\n\nHF authentication: passed\n\nAccount: webmp3\n\nNo model download or upload was performed.\n')
