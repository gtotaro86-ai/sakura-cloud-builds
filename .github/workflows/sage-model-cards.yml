name: Update Sage model cards
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Sage BF16 CPU quantization and release]
    types: [completed]
    branches: [main]
  push:
    paths: [cards-request.json]
permissions:
  contents: read
concurrency:
  group: sage-model-cards
  cancel-in-progress: false
jobs:
  cards:
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      SAGE_STANDARD_RUNNER: ubuntu-24.04
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify small documentation sources
        run: sha256sum -c SHA256SUMS
      - name: Install pinned documentation client
        run: python -m pip install -r requirements-upload.txt
      - name: Update cards while retaining all model hashes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python update_cards.py
