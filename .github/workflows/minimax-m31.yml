name: MiniMax M3.1 Flash CPU quantization and release
'on':
  workflow_dispatch: null
  push:
    paths:
    - builds/minimax-m31-flash/request.json
permissions:
  contents: read
concurrency:
  group: minimax-m31-release
  cancel-in-progress: false
jobs:
  qualify:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    defaults: &id001
      run:
        working-directory: builds/minimax-m31-flash
    env: &id002
      REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      MINIMAX_STANDARD_RUNNER: ubuntu-24.04
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    timeout-minutes: 45
    steps:
    - &id003
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - &id004
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - &id005
      name: Verify frozen source and authorized free CPU release
      run: 'sha256sum -c SHA256SUMS

        python verify_request.py'
    - &id006
      name: Verify HF publisher before building
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: 'python - <<''PY''

        import json,urllib.request

        from credentials import authentication_token

        req=urllib.request.Request(''https://huggingface.co/api/whoami-v2'',headers={''Authorization'':''Bearer ''+authentication_token()})

        with urllib.request.urlopen(req,timeout=60) as r:assert json.load(r)[''name'']==''webmp3''

        print(''HF publisher verified; credential value suppressed.'')

        PY'
    - &id007
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ggml-org/llama.cpp
        ref: 970b51ce7c9ba5fff0726c5e9994f1c2f0e4eedc
        path: llama
        persist-credentials: false
    - &id008
      name: Install isolated pinned CPU and native-Xet clients; verify disk budget
      run: bash runner-setup.sh
    - &id009
      name: Build patched pinned CPU runtime and native quantizer
      run: bash runner-build.sh
    - &id010
      name: Check bounded publication and recovery controls
      run: upload-env/bin/python control_checks.py
    - name: Check public HF targets and available storage metadata
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: upload-env/bin/python storage_preflight.py
    - name: Verify real decoders, all native policies, split headers and synthetic sparse runtime
      run: convert-env/bin/python qualify.py --llama "$GITHUB_WORKSPACE/llama" --build "$RUNNER_TEMP/minimax-native" --work "$RUNNER_TEMP/minimax-qualify"
  assets:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    defaults: *id001
    env: *id002
    needs: qualify
    timeout-minutes: 90
    outputs:
      asset_revision: ${{ steps.assets.outputs.asset_revision }}
    steps:
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - *id010
    - id: assets
      name: Stream F16 projector and retain unchanged DSpark on assets branch
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_XET_CACHE: ${{ runner.temp }}/minimax-xet-cache
      run: upload-env/bin/python assets.py --converter-python "$PWD/convert-env/bin/python" --llama "$GITHUB_WORKSPACE/llama" --work
        "$RUNNER_TEMP/minimax-assets"
  quantize:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    defaults: *id001
    env: *id002
    name: quantize-${{ matrix.variant }}-${{ matrix.index }}
    needs:
    - qualify
    - assets
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - variant: Q2_K
          index: 0
        - variant: Q2_K
          index: 1
        - variant: Q2_K
          index: 2
        - variant: Q2_K
          index: 3
        - variant: Q3_K_M
          index: 0
        - variant: Q3_K_M
          index: 1
        - variant: Q3_K_M
          index: 2
        - variant: Q3_K_M
          index: 3
        - variant: Q3_K_M
          index: 4
        - variant: Q4_K_M
          index: 0
        - variant: Q4_K_M
          index: 1
        - variant: Q4_K_M
          index: 2
        - variant: Q4_K_M
          index: 3
        - variant: Q4_K_M
          index: 4
        - variant: Q4_K_M
          index: 5
        - variant: Q5_K_M
          index: 0
        - variant: Q5_K_M
          index: 1
        - variant: Q5_K_M
          index: 2
        - variant: Q5_K_M
          index: 3
        - variant: Q5_K_M
          index: 4
        - variant: Q5_K_M
          index: 5
        - variant: Q5_K_M
          index: 6
    steps:
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - *id010
    - name: Stream and stage one independently verified GGUF shard
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_XET_CACHE: ${{ runner.temp }}/minimax-xet-cache
        MINIMAX_ASSET_REVISION: ${{ needs.assets.outputs.asset_revision }}
      run: upload-env/bin/python stage.py --variant "${{ matrix.variant }}" --index "${{ matrix.index }}" --asset-revision "$MINIMAX_ASSET_REVISION"
        --converter-python "$PWD/convert-env/bin/python" --llama "$GITHUB_WORKSPACE/llama" --build "$RUNNER_TEMP/minimax-native" --work
        "$RUNNER_TEMP/minimax-shard"
