name: Release completed MiniMax GGUF
on:
  workflow_dispatch:
  push:
    paths: [builds/minimax-m31-release/request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: minimax-ready-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: builds/minimax-m31-release
    env:
      REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      MINIMAX_STANDARD_RUNNER: ubuntu-24.04
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '60'
      HF_HUB_ETAG_TIMEOUT: '30'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify small authorized publisher sources
        run: sha256sum -c SHA256SUMS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 35fe24364aede18b80e7789cff74ae5a4f2bb231
          path: original-build
          persist-credentials: false
      - name: Verify exact original model construction and publication sources
        working-directory: original-build/builds/minimax-m31-flash
        run: sha256sum -c SHA256SUMS
      - name: Install pinned metadata publication client
        run: python -m pip install --no-cache-dir -r "$GITHUB_WORKSPACE/original-build/builds/minimax-m31-flash/requirements-upload.txt"
      - name: Check complete-model release guards
        run: python checks.py
      - name: Verify every completed variant shard and publish the complete HF model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python publish_ready.py --original-build "$GITHUB_WORKSPACE/original-build"
      # Metadata-only: no model-body download, GPU, paid runner, model artifact or requantization.
