name: Flint autonomous publication finalizer
on:
  workflow_run:
    workflows: [Flint BF16 CPU quantization and release]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: flint-autonomous-finalizer
  cancel-in-progress: false
jobs:
  finalize:
    if: >-
      github.event.repository.private == false &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: builds/flint
    env:
      REPO_VISIBILITY: public
      FLINT_STANDARD_RUNNER: ubuntu-24.04
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify small finalizer sources
        run: sha256sum -c SHA256SUMS
      - name: Install pinned metadata publication client
        run: python -m pip install -r requirements-upload.txt
      - name: Verify releases, finalize uploaded streams or retry transient failed builds once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          FLINT_BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python finalize.py --run-id "$FLINT_BUILD_RUN_ID"
      # Runs independently of the chat, its usage limits and the user's PC.
